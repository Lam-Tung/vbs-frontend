<import from="../page.scss"></import>
<import from="./vehicle-page.scss"></import>

<div class="page-container">
    <div class="vehicle-header">
        <search-bar></search-bar>
        <div class="button-layout">
            <positive-button if.bind="selectedVehicle" icon="${editIcon}" label="Edit vehicle"
                positive-button-clicked.trigger="editVehicle()">
            </positive-button>
            <positive-button icon="${addIcon}" label="Add vehicle" positive-button-clicked.trigger="addVehicle()">
            </positive-button>
        </div>

    </div>
    <div id="vehicle-table"></div>
</div>
