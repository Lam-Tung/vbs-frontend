<import from="../dialog.scss"></import>
<import from="./confirm-dialog.scss"></import>

<div class="confirm-dialog-container">
    <!-- header -->
    <div class="dialog-header">
        ${data.title}
        <i class="${xIcon} x-icon" click.trigger="closeClicked()"></i>
    </div>
    <!-- body -->
    <div class="dialog-body">
        ${data.message}
    </div>
    <!-- footer -->
    <div class="dialog-footer">
        <positive-button icon="${confirmIcon}" label="Confirm"
            positive-button-clicked.trigger="positiveClicked()"></positive-button>
        <negative-button icon="${cancelIcon}" label="Cancel"
            negative-button-clicked.trigger="negativeClicked()"></negative-button>
    </div>
</div>
